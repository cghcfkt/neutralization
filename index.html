<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>微觀酸鹼中和模擬 (Microscopic Neutralization) - 放大改良版</title>
    <style>
        :root {
            --primary-color: #0d9488;
            --bg-color: #f0fdfa;
            --text-color: #111827;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 20px;
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .header {
            text-align: center;
            margin-bottom: 20px;
        }

        .container {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            max-width: 1000px;
            width: 100%;
            justify-content: center;
        }

        .panel {
            background: white;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.08);
        }

        .canvas-container {
            position: relative;
            width: 100%;
            max-width: 500px;
            border: 3px solid #9ca3af;
            border-top: none;
            border-radius: 0 0 20px 20px;
            background-color: #e0f2fe;
            overflow: hidden;
        }

        canvas {
            display: block;
            width: 100%;
            height: 400px;
        }

        .controls {
            flex: 1;
            min-width: 300px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        button {
            padding: 12px;
            font-size: 1.1rem;
            font-weight: bold;
            color: white;
            background-color: var(--primary-color);
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: transform 0.1s, background-color 0.2s;
        }

        button:hover { background-color: #0f766e; }
        button:active { transform: scale(0.98); }
        
        .btn-speed { background-color: #f59e0b; color: #fff; }
        .btn-speed:hover { background-color: #d97706; }

        .btn-reset { background-color: #ef4444; }
        .btn-reset:hover { background-color: #dc2626; }

        .legend {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-top: 15px;
            padding: 15px;
            background: #f3f4f6;
            border-radius: 8px;
        }

        .legend-item {
            display: flex;
            align-items: center;
            gap: 10px;
            font-weight: bold;
        }

        .circle {
            width: 24px;
            height: 24px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 0.8rem;
            font-weight: bold;
        }

        .color-h { background-color: #ef4444; }    
        .color-oh { background-color: #3b82f6; }   
        .color-cl { background-color: #22c55e; }   
        .color-na { background-color: #a855f7; }   
        .color-h2o { background-color: #06b6d4; }  

        .stats {
            font-size: 1.1rem;
            line-height: 1.8;
            margin-top: 10px;
        }
        
        .equation {
            font-family: 'Courier New', Courier, monospace;
            background: #1f2937;
            color: #10b981;
            padding: 10px;
            border-radius: 6px;
            text-align: center;
            font-weight: bold;
            margin-top: 15px;
        }
    </style>
</head>
<body>

    <div class="header">
        <h1>錐形瓶微觀世界 (Microscopic Titration)</h1>
        <p>放大聚焦版：模擬 HCl 與 NaOH 的中和碰撞及旁觀離子</p>
    </div>

    <div class="container">
        <div class="panel">
            <h2 style="margin-top:0; border-bottom: 2px solid #eee; padding-bottom:10px;">微觀視角 (溶液內部)</h2>
            <div class="canvas-container">
                <canvas id="simCanvas"></canvas>
            </div>
        </div>

        <div class="panel controls">
            <button onclick="addNaOH()">+ 加入 1 滴 NaOH (加入 2 對 Na⁺/OH⁻)</button>
            <button id="speed-btn" class="btn-speed" onclick="toggleSpeed()">⚡ 切換速度: 正常 (1x)</button>
            <button class="btn-reset" onclick="initSimulation()">🔄 重置實驗 (Reset)</button>

            <div class="equation">
                離子方程式: H⁺(aq) + OH⁻(aq) → H₂O(l)
            </div>

            <div class="legend">
                <div class="legend-item"><div class="circle color-h">H⁺</div> 氫離子 (酸)</div>
                <div class="legend-item"><div class="circle color-oh">OH⁻</div> 氫氧離子 (鹼)</div>
                <div class="legend-item"><div class="circle color-cl">Cl⁻</div> 氯離子 (旁觀)</div>
                <div class="legend-item"><div class="circle color-na">Na⁺</div> 鈉離子 (旁觀)</div>
                <div class="legend-item"><div class="circle color-h2o">H₂O</div> 水分子</div>
            </div>

            <div class="stats" id="stats-panel">
                </div>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('simCanvas');
        const ctx = canvas.getContext('2d');
        
        const width = 500;
        const height = 400;
        canvas.width = width;
        canvas.height = height;

        let particles = [];
        let animationId;

        // 【更新】粒子半徑放大一倍 (12 -> 24)
        const PARTICLE_RADIUS = 24;
        
        // 速度控制系統
        const speedSettings = [
            { label: '正常 (1x)', multiplier: 1.5 },
            { label: '快速 (2x)', multiplier: 3.0 },
            { label: '慢速 (0.3x)', multiplier: 0.5 }
        ];
        let currentSpeedIdx = 0;
        let currentSpeed = speedSettings[currentSpeedIdx].multiplier;

        class Particle {
            constructor(type, x, y) {
                this.type = type;
                this.r = PARTICLE_RADIUS;
                this.x = x !== undefined ? x : Math.random() * (width - this.r * 2) + this.r;
                this.y = y !== undefined ? y : Math.random() * (height - this.r * 2) + this.r;
                
                // 使用當前全域速度來賦予初始速度
                const angle = Math.random() * Math.PI * 2;
                this.vx = Math.cos(angle) * currentSpeed;
                this.vy = Math.sin(angle) * currentSpeed;

                // 若是從上方滴入的 NaOH，讓其初始有明顯向下的運動趨勢
                if (y < 30) {
                    this.vy = Math.abs(this.vy) + currentSpeed;
                }

                switch(type) {
                    case 'H':   this.color = '#ef4444'; this.label = 'H⁺'; break;
                    case 'OH':  this.color = '#3b82f6'; this.label = 'OH⁻'; break;
                    case 'Cl':  this.color = '#22c55e'; this.label = 'Cl⁻'; break;
                    case 'Na':  this.color = '#a855f7'; this.label = 'Na⁺'; break;
                    case 'H2O': this.color = '#06b6d4'; this.label = 'H₂O'; break;
                }
            }

            draw() {
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.r, 0, Math.PI * 2);
                ctx.fillStyle = this.color;
                ctx.fill();
                ctx.strokeStyle = 'rgba(0,0,0,0.3)';
                ctx.lineWidth = 2;
                ctx.stroke();

                // 【更新】文字隨粒子放大 (16px)
                ctx.fillStyle = 'white';
                ctx.font = 'bold 16px Arial';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText(this.label, this.x, this.y);
            }

            update() {
                this.x += this.vx;
                this.y += this.vy;

                if (this.x - this.r < 0 || this.x + this.r > width) {
                    this.vx *= -1;
                    this.x = Math.max(this.r, Math.min(width - this.r, this.x));
                }
                if (this.y - this.r < 0 || this.y + this.r > height) {
                    this.vy *= -1;
                    this.y = Math.max(this.r, Math.min(height - this.r, this.y));
                }
            }
        }

        // 一鍵切換速度功能
        function toggleSpeed() {
            let oldSpeed = currentSpeed;
            currentSpeedIdx = (currentSpeedIdx + 1) % speedSettings.length;
            currentSpeed = speedSettings[currentSpeedIdx].multiplier;
            
            // 更新按鈕文字
            document.getElementById('speed-btn').innerText = `⚡ 切換速度: ${speedSettings[currentSpeedIdx].label}`;

            // 即時按比例更新畫面上所有現存粒子的速度
            let speedRatio = currentSpeed / oldSpeed;
            particles.forEach(p => {
                p.vx *= speedRatio;
                p.vy *= speedRatio;
            });
        }

        function initSimulation() {
            cancelAnimationFrame(animationId);
            particles = [];

            // 【更新】數量精簡：6對 H+ 和 Cl-
            for (let i = 0; i < 6; i++) {
                particles.push(new Particle('H'));
                particles.push(new Particle('Cl'));
            }

            updateStats();
            animate();
        }

        function addNaOH() {
            // 【更新】數量精簡：每次加入 2對 Na+ 和 OH-
            for (let i = 0; i < 2; i++) {
                let dropX = width / 2 + (Math.random() * 60 - 30);
                particles.push(new Particle('Na', dropX, 25));
                particles.push(new Particle('OH', dropX, 25));
            }
        }

        function checkCollisions() {
            let toRemove = [];
            let newWater = [];

            for (let i = 0; i < particles.length; i++) {
                for (let j = i + 1; j < particles.length; j++) {
                    let p1 = particles[i];
                    let p2 = particles[j];

                    let dx = p1.x - p2.x;
                    let dy = p1.y - p2.y;
                    let dist = Math.sqrt(dx * dx + dy * dy);

                    // 發生碰撞
                    if (dist < PARTICLE_RADIUS * 2) {
                        // 判斷 H+ 與 OH- 中和
                        if ((p1.type === 'H' && p2.type === 'OH') || (p1.type === 'OH' && p2.type === 'H')) {
                            if (!toRemove.includes(i)) toRemove.push(i);
                            if (!toRemove.includes(j)) toRemove.push(j);
                            
                            let midX = (p1.x + p2.x) / 2;
                            let midY = (p1.y + p2.y) / 2;
                            // 產生的 H2O 也會繼承當前設定的速度
                            newWater.push(new Particle('H2O', midX, midY));
                            
                            // 反應閃光效果 (依據新半徑放大)
                            ctx.beginPath();
                            ctx.arc(midX, midY, PARTICLE_RADIUS * 2, 0, Math.PI * 2);
                            ctx.fillStyle = 'rgba(255, 255, 255, 0.9)';
                            ctx.fill();
                        } else {
                            // 物理反彈
                            let tempVx = p1.vx;
                            let tempVy = p1.vy;
                            p1.vx = p2.vx; p1.vy = p2.vy;
                            p2.vx = tempVx; p2.vy = tempVy;
                            
                            // 強制推開避免重疊黏死
                            p1.x += p1.vx; p1.y += p1.vy;
                        }
                    }
                }
            }

            if (toRemove.length > 0) {
                particles = particles.filter((_, index) => !toRemove.includes(index));
                particles.push(...newWater);
                updateStats();
            }
        }

        function updateStats() {
            let counts = { 'H': 0, 'OH': 0, 'Cl': 0, 'Na': 0, 'H2O': 0 };
            particles.forEach(p => counts[p.type]++);

            let stateText = "中性 (Neutral)";
            let stateColor = "#10b981"; 
            if (counts['H'] > counts['OH']) { stateText = "酸性 (Acidic)"; stateColor = "#ef4444"; }
            if (counts['OH'] > counts['H']) { stateText = "鹼性 (Alkaline)"; stateColor = "#3b82f6"; }

            const panel = document.getElementById('stats-panel');
            panel.innerHTML = `
                <div style="font-weight:bold; margin-bottom:10px; font-size:1.2rem; color:${stateColor};">目前溶液狀態: ${stateText}</div>
                <strong>離子數量計數：</strong><br>
                🔴 H⁺: ${counts['H']} &nbsp;&nbsp;|&nbsp;&nbsp; 🟢 Cl⁻ (旁觀): ${counts['Cl']}<br>
                🔵 OH⁻: ${counts['OH']} &nbsp;&nbsp;|&nbsp;&nbsp; 🟣 Na⁺ (旁觀): ${counts['Na']}<br>
                💧 H₂O (水分子): ${counts['H2O']}
            `;
        }

        function animate() {
            ctx.fillStyle = 'rgba(224, 242, 254, 0.6)'; // 稍微增強尾跡效果
            ctx.fillRect(0, 0, width, height);

            particles.forEach(p => {
                p.update();
                p.draw();
            });

            checkCollisions();

            animationId = requestAnimationFrame(animate);
        }

        window.onload = initSimulation;

    </script>
</body>
</html>
